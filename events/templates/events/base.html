<!DOCTYPE html>
<html>
<head>
    <title>Event Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }
        nav {
            background: #263238;
            padding: 18px 40px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }
        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }
        h1 { color: #263238; }
        .button {
            display: inline-block;
            background: #1976d2;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 18px 0;
            border-radius: 8px;
            box-shadow: 0 2px 7px #ddd;
        }
        .edit { color: #1976d2; text-decoration: none; margin-right: 15px; }
        .delete { color: #d32f2f; text-decoration: none; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 7px 0 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        label { font-weight: bold; }
        .confirm {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'event_list' %}">Event Planner</a>
    <a href="{% url 'add_event' %}">Add Event</a>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
